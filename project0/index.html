<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO App — Список покупок</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body class="bg-light text-dark py-5">
    <div class="container" style="max-width: 550px;">
      <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
        
        <h1 class="h4 text-center fw-bold mb-4">Список покупок</h1>

        <div class="d-flex justify-content-between mb-3 text-secondary small">
          <span>Всього: <strong id="item-count" class="badge bg-secondary text-white ms-1">0</strong></span>
          <span>Залишилось: <strong id="unchecked-count" class="badge bg-primary text-white ms-1">0</strong></span>
        </div>

        <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded-3 mb-4 small border">
          <div>
            <span class="text-muted d-block">Загальна сума</span>
            <span class="fw-bold text-dark fs-6"><span id="total-price">0.00</span> грн</span>
          </div>
          <div class="text-end">
            <span class="text-muted d-block">До оплати</span>
            <span class="fw-bold text-primary fs-6"><span id="remaining-price">0.00</span> грн</span>
          </div>
        </div>

        <div class="mb-4">
          <div class="input-group mb-2">
            <input type="text" id="todo-input" class="form-control" placeholder="Назва товару..." />
          </div>
          <div class="input-group mb-3">
            <input type="number" id="price-input" class="form-control" placeholder="Ціна (грн)..." />
          </div>
          <button id="add-todo-btn" class="btn btn-primary w-100 py-2 rounded-3 fw-medium border-0 shadow-sm">
            + Додати товар
          </button>
        </div>

        <ul id="todo-list" class="list-group list-group-flush"></ul>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
